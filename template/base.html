<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADHD Railways - {% block title %}Book Trains{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: #ff6b6b;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 1.8rem;
        }
        .header h1 span {
            font-size: 1.2rem;
            background: #ff4757;
            padding: 5px 12px;
            border-radius: 50px;
            margin-left: 10px;
        }
        .wallet-badge {
            background: #2ed573;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
        }
        nav {
            background: #f1f2f6;
            padding: 12px 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        nav a {
            color: #2c3e50;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
            transition: 0.3s;
        }
        nav a:hover {
            background: #ff6b6b;
            color: white;
        }
        .content {
            padding: 30px;
        }
        .btn {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            background: #ff4757;
        }
        .btn-green {
            background: #2ed573;
        }
        .btn-green:hover {
            background: #1abc9c;
        }
        .card {
            background: #f9f9f9;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .error {
            background: #ffeaa7;
            color: #d63031;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #d63031;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #28a745;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #ff6b6b;
            color: white;
        }
        tr:hover {
            background: #f1f2f6;
        }
        @keyframes shake {
            0%,100%{transform:translateX(0)}
            25%{transform:translateX(-5px)}
            75%{transform:translateX(5px)}
        }
        .ai-badge {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ADHD Railways <span>Beta v2.0</span></h1>
            <div class="wallet-badge">Wallet: ₹{{ balance }}</div>
        </div>
        <nav>
            <a href="/">Home</a>
            <a href="/my-bookings">My Bookings</a>
            <a href="/wallet">Wallet</a>
            <a href="/alternate-routes?source=Delhi&destination=Mumbai">Alternate Routes</a>
        </nav>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
